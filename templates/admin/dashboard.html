{% extends "base.html" %}
{% block content %}
<h2>Admin Dashboard</h2>
<div class="row g-3">
  {% for label, number in counts.items() %}
  <div class="col-6 col-md-4">
    <div class="stat"><div class="num">{{ number }}</div>{{ label }}</div>
  </div>
  {% endfor %}
</div>
{% if pending %}
<p class="mt-3">&gt;&gt; {{ pending }} examiner(s) waiting for approval.
  <a href="{{ url_for('admin.examiners') }}">Review now</a></p>
{% endif %}
{% endblock %}
