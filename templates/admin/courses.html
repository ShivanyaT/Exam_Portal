{% extends "base.html" %}
{% block content %}
<h2>Courses</h2>
<table class="table table-bordered">
  <tr><th>ID</th><th>Code</th><th>Name</th><th>Description</th><th>Status</th><th>Action</th></tr>
  {% for c in courses %}
  <tr>
    <td>{{ c.id }}</td><td>{{ c.code }}</td><td>{{ c.name }}</td><td>{{ c.description }}</td>
    <td>{{ c.status }}</td>
    <td class="d-flex gap-1">
      <a class="btn btn-sm" href="{{ url_for('admin.course_form', id=c.id) }}">Edit</a>
      <form method="post" action="{{ url_for('admin.course_delete', id=c.id) }}">
        <button class="btn btn-sm btn-danger">Delete</button>
      </form>
    </td>
  </tr>
  {% else %}
  <tr><td colspan="6">No courses yet.</td></tr>
  {% endfor %}
</table>
<a class="btn" href="{{ url_for('admin.course_form') }}">+ New Course</a>
{% endblock %}
